name: ports

services:
  socket-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    read_only: true
    tmpfs:
      - /run

  ports:
    image: ghcr.io/palermostest25/ports:latest
    restart: unless-stopped
    depends_on:
      - socket-proxy
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      PORT_RANGES: ${PORT_RANGES:-1000-1999,2000-2999,3000-3999,4000-4999,5000-9999,10000-65535}
      RESERVED_PORTS: ${RESERVED_PORTS:-}
      HTTPS_PORTS: ${HTTPS_PORTS:-443,8443,9443}
      AVAILABLE_COUNT: ${AVAILABLE_COUNT:-20}
      SHOW_ALL_CONTAINERS: ${SHOW_ALL_CONTAINERS:-true}
      CHECK_HOST_BIND: ${CHECK_HOST_BIND:-false}
      LINK_HOST: ${LINK_HOST:-}
    ports:
      - "${PORTS_HTTP_PORT:-5000}:5000"
    networks:
      - default
      - docker-api
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  docker-api:
    internal: true

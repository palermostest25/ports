name: ports

services:
  ports:
    image: ghcr.io/palermostest25/ports:latest
    container_name: ports
    restart: unless-stopped
    user: "0:0"
    environment:
      PORT_RANGES: "1000-1999,2000-2999,3000-3999,4000-4999,5000-9999,10000-65535"
      RESERVED_PORTS: ""
      HTTPS_PORTS: "443,8443,9443"
      AVAILABLE_COUNT: "20"
      SHOW_ALL_CONTAINERS: "true"
      CHECK_HOST_BIND: "false"
      # LINK_HOST: "192.168.1.10" # Optional; defaults to the browser hostname.
    ports:
      - "1100:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
